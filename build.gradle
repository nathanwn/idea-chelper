plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'io.github.nathanwn'
// Plugin version is set in gradle.properties.
version = pluginVersion

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'
    implementation 'org.jetbrains:annotations:19.0.0'
    implementation 'org.json:json:20250517'
    intellijPlatform {
        intellijIdea intellijVersion
        bundledPlugin 'com.intellij.java'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

intellijPlatform {
    pluginVerification {
        version = pluginVersion

        ides {
            // NOTE: Target IntelliJ version is set in gradle.properties.
            create IntelliJPlatformType.IntellijIdea, intellijVersion
        }
    }
}

buildSearchableOptions {
    enabled = false
}
